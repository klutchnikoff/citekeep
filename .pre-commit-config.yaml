# Install with:
#   pre-commit install --hook-type pre-commit --hook-type pre-push
#
# Every hook is `local` + `language: system`, so they run the tools from this
# project's environment rather than versions pre-commit would manage on its
# own. The lock file stays the single source of truth for which ruff runs.
repos:
  - repo: local
    hooks:
      # --- pre-commit: fix rather than refuse ------------------------------
      #
      # Unlike CI, which must check without touching anything, these rewrite
      # the file. pre-commit then stops the commit and reports what changed,
      # so you re-read it before committing again.
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]
        stages: [pre-commit]

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]
        stages: [pre-commit]

      # --- pre-push: everything CI would tell you, before it does ----------
      - id: pytest
        name: pytest
        entry: uv run --frozen pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]

      # A lock file out of step with pyproject.toml is silent locally and
      # fatal in CI, where `uv run --frozen` refuses to resolve. It cost two
      # red runs before this hook existed.
      - id: uv-lock-check
        name: uv lock --check
        entry: uv lock --check
        language: system
        pass_filenames: false
        stages: [pre-push]

      # --strict turns warnings into failures: a docstring documenting a
      # parameter with no type annotation, a nav entry pointing at a missing
      # page, a dead internal link. Read the Docs fails on warnings too, so
      # this is also the guarantee that the published site will build.
      - id: mkdocs
        name: mkdocs build --strict
        entry: uv run --frozen --extra docs mkdocs build --strict
        language: system
        pass_filenames: false
        stages: [pre-push]

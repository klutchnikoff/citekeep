version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true

# mkdocstrings imports citekeep to read its docstrings, so the package itself
# has to be installed — `path: .` does that. `extra_requirements` reads
# [project.optional-dependencies], not [dependency-groups]: the `docs` extra
# exists for this, and the `dev` group is deliberately not reused here.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
